    const { useState, useEffect, useCallback } = React;

    // ---------- Hilfsfunktionen ----------
    const fmtEUR = (n) => new Intl.NumberFormat("de-DE", { style: "currency", currency: "EUR" }).format(isFinite(n) ? n : 0);
    const fmtNum = (n, d = 1) => new Intl.NumberFormat("de-DE", { minimumFractionDigits: d, maximumFractionDigits: d }).format(isFinite(n) ? n : 0);
    const fmtDate = (iso) => iso ? new Date(iso + "T12:00:00").toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" }) : "";
    const fmtZeit = (ts) => ts ? new Date(ts).toLocaleString("de-DE", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "";
    const parseDE = (s) => { if (typeof s === "number") return s; if (!s) return NaN; return parseFloat(String(s).replace(",", ".")); };
    const today = () => new Date().toISOString().slice(0, 10);

      const kanisterKosten = state.tankungen.reduce((s, t) => s + t.preis * t.liter, 0);
      const fahrtDetails = state.fahrten.map((f) => {
        if (f.endKm == null) {
          return { ...f, km: null, liter: null, kosten: 0, offen: true };
        }
        const km = Math.max(0, f.endKm - f.startKm);
        const liter = (km / 100) * state.verbrauch;
        return { ...f, km, liter, kosten: liter * f.preis, offen: false };
      });
      const fahrtKosten = fahrtDetails.reduce((s, f) => s + (f.kosten || 0), 0);
      const kmGesamt = fahrtDetails.reduce((s, f) => s + (f.km || 0), 0);
      return { kanisterKosten, fahrtDetails, fahrtKosten, kmGesamt, gesamt: kanisterKosten + fahrtKosten };
    }

    // ---------- Datenbank ----------
    async function ladeStand() {
      const { data, error } = await sb.from("abrechnung").select("data, updated_at").eq("id", 1).single();
      if (error) throw error;
      const stand = { ...leererStand, ...data.data };
      if (stand.aktuellerPreis == null) {
        if (stand.tankungen.length > 0) {
          stand.aktuellerPreis = stand.tankungen[stand.tankungen.length - 1].preis;
        } else if (stand.history.length > 0 && stand.history[0].tankungen && stand.history[0].tankungen.length > 0) {
          const letzteHist = stand.history[0].tankungen;
          stand.aktuellerPreis = letzteHist[letzteHist.length - 1].preis;
        }
      }
      return { stand, updatedAt: data.updated_at };
    }
    async function speichereStand(stand) {
      const { error } = await sb.from("abrechnung")
        .update({ data: stand, updated_at: new Date().toISOString() })
        .eq("id", 1);
      if (error) throw error;
    }

    // ---------- UI-Bausteine ----------
    const inputCls = "w-full min-w-0 rounded-lg border border-slate-300 bg-white px-3 py-2 text-[15px] text-slate-900 focus:outline-none focus:ring-2 focus:ring-teal-700/40 focus:border-teal-700";
    const dateInputCls = inputCls + " appearance-none";

    function Feld({ label, children }) {
      return (
        <label className="block min-w-0">
          <span className="block text-[11px] font-semibold uppercase tracking-wider text-slate-500 mb-1">{label}</span>
          {children}
        </label>
      );
    }

    function Abschnitt({ titel, hinweis, children }) {
      return (
        <section className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
          <div className="px-4 pt-4 pb-2">
            <h2 className="archivo text-[17px] font-bold text-slate-900">{titel}</h2>
            {hinweis && <p className="text-[12px] text-slate-500 mt-0.5">{hinweis}</p>}
          </div>
          <div className="px-4 pb-4">{children}</div>
        </section>
      );
    }

    // ---------- Login ----------
    function Login({ onFehler, fehler }) {
      const [email, setEmail] = useState("");
      const [passwort, setPasswort] = useState("");
      const [laedt, setLaedt] = useState(false);

      const anmelden = async () => {
        setLaedt(true);
        const { error } = await sb.auth.signInWithPassword({ email, password: passwort });
        setLaedt(false);
        if (error) onFehler("Anmeldung fehlgeschlagen. E-Mail und Passwort prüfen.");
      };

      return (
        <div className="min-h-screen flex items-center justify-center px-4">
          <div className="w-full max-w-sm">
            <div className="bg-teal-900 text-white rounded-t-2xl px-6 pt-6 pb-5">
              <p className="text-[11px] font-semibold uppercase tracking-[0.2em] text-teal-300">Familien-Tankkasse</p>
              <h1 className="archivo text-2xl font-extrabold">Tankabrechnung</h1>
            </div>
            <div className="bg-white rounded-b-2xl shadow-md px-6 py-6 space-y-3">
              <Feld label="E-Mail">
                <input type="email" className={inputCls} value={email} onChange={(e) => setEmail(e.target.value)} autoComplete="email" />
              </Feld>
              <Feld label="Passwort">
                <input type="password" className={inputCls} value={passwort} onChange={(e) => setPasswort(e.target.value)} autoComplete="current-password"
                  onKeyDown={(e) => e.key === "Enter" && anmelden()} />
              </Feld>
              {fehler && <p className="text-[13px] text-red-600">{fehler}</p>}
              <button onClick={anmelden} disabled={laedt}
                className="archivo w-full rounded-xl bg-amber-400 hover:bg-amber-300 disabled:opacity-60 text-teal-950 font-bold py-3 text-[15px] transition-colors">
                {laedt ? "Anmelden …" : "Anmelden"}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ---------- Haupt-App ----------
    function App() {
      const [session, setSession] = useState(undefined);
      const [state, setState] = useState(null);
      const [updatedAt, setUpdatedAt] = useState(null);
      const [tab, setTab] = useState("aktuell");
      const [fehler, setFehler] = useState("");
      const [sync, setSync] = useState("");

      const [tForm, setTForm] = useState({ datum: today(), gesamt: "", liter: "20", gesamtbetrag: "", km: "" });
      const [fForm, setFForm] = useState({ datum: today(), startKm: "", endKm: "" });
      const [bearbeiteTankungId, setBearbeiteTankungId] = useState(null);
      const [bearbeiteFahrtId, setBearbeiteFahrtId] = useState(null);
      const [verbrauchInput, setVerbrauchInput] = useState("");

      useEffect(() => {
        sb.auth.getSession().then(({ data }) => setSession(data.session));
        const { data: sub } = sb.auth.onAuthStateChange((_e, s) => setSession(s));
        return () => sub.subscription.unsubscribe();
      }, []);

      const laden = useCallback(async () => {
        try {
          setSync("Lade …");
          const { stand, updatedAt } = await ladeStand();
          setState(stand);
          setUpdatedAt(updatedAt);
          setVerbrauchInput(String(stand.verbrauch).replace(".", ","));
          setFehler("");
          setSync("");
        } catch (e) {
          setSync("");
          setFehler("Daten konnten nicht geladen werden. Verbindung prüfen und neu laden.");
        }
      }, []);

      useEffect(() => { if (session) laden(); }, [session, laden]);

      useEffect(() => {
        if (state) setVerbrauchInput(String(state.verbrauch).replace(".", ","));
      }, [state && state.verbrauch]);

      useEffect(() => {
        if (!state || !state.fahrten.length) return;
        const letzte = state.fahrten[state.fahrten.length - 1];
        if (letzte.endKm == null) return;
        setFForm((f) => (bearbeiteFahrtId ? f : { ...f, startKm: String(letzte.endKm) }));
      }, [state && state.fahrten]);

      const speichern = async (neu) => {
        setState(neu);
        try {
          setSync("Speichere …");
          await speichereStand(neu);
          setUpdatedAt(new Date().toISOString());
          setSync("");
        } catch (e) {
          setSync("");
          setFehler("Speichern fehlgeschlagen. Verbindung prüfen und erneut versuchen.");
        }
      };

      if (session === undefined) {
        return <div className="min-h-screen flex items-center justify-center text-slate-500">Lade …</div>;
      }
      if (!session) {
        return <Login fehler={fehler} onFehler={setFehler} />;
      }
      if (!state) {
        return (
          <div className="min-h-screen flex items-center justify-center text-slate-500">
            {fehler ? (
              <div className="text-center px-6">
                <p className="text-red-600 mb-3">{fehler}</p>
                <button onClick={laden} className="rounded-xl bg-teal-800 text-white font-semibold px-5 py-2">Erneut laden</button>
              </div>
            ) : "Lade Abrechnung …"}
          </div>
        );
      }

      const calc = berechne(state);
      const letzterPreis = state.tankungen.length
        ? state.tankungen[state.tankungen.length - 1].preis
        : state.aktuellerPreis;
      const tVorschau = (() => {
        const gesamt = parseDE(tForm.gesamt);
        const kanister = parseDE(tForm.liter);
        const betrag = parseDE(tForm.gesamtbetrag);
        const km = parseDE(tForm.km);
        if (!isFinite(gesamt) || gesamt <= 0) return null;
        const literpreis = isFinite(betrag) && betrag > 0 ? betrag / gesamt : null;
        const roomiListe = isFinite(kanister) ? gesamt - kanister : null;
        const verbrauch = roomiListe != null && roomiListe > 0 && isFinite(km) && km > 0 ? (roomiListe / km) * 100 : null;
        return { literpreis, roomiListe, verbrauch };
      })();

      const tankungHinzufuegen = () => {
        const gesamt = parseDE(tForm.gesamt);
        const liter = parseDE(tForm.liter);
        const gesamtbetrag = parseDE(tForm.gesamtbetrag);
        if (!isFinite(gesamt) || gesamt <= 0) {
          setFehler("Bitte gültige Gesamt-Betankung in Litern eingeben."); return;
        }
        if (!isFinite(liter) || liter < 0) {
          setFehler("Bitte gültige Kanister-Menge eingeben."); return;
        }
        if (liter > gesamt) {
          setFehler("Die Kanister-Menge kann nicht größer als die Gesamt-Betankung sein."); return;
        }
        if (!isFinite(gesamtbetrag) || gesamtbetrag <= 0) {
          setFehler("Bitte gültigen Gesamtbetrag eingeben."); return;
        }
        const kmRoh = tForm.km.trim();
        let km = null;
        if (kmRoh !== "") {
          km = parseDE(kmRoh);
          if (!isFinite(km) || km <= 0) {
            setFehler("Bitte gültige gefahrene km eingeben oder das Feld leer lassen."); return;
          }
        }
        setFehler("");
        const preis = gesamtbetrag / gesamt;
        const roomiListe = gesamt - liter;
        const neuerVerbrauch = km != null && roomiListe > 0 ? (roomiListe / km) * 100 : null;
        const eintrag = { datum: tForm.datum, preis, liter, gesamt, gesamtbetrag, km, verbrauch: neuerVerbrauch };
        const istLetzte = !bearbeiteTankungId ||
          (state.tankungen.length > 0 && state.tankungen[state.tankungen.length - 1].id === bearbeiteTankungId);
        if (bearbeiteTankungId) {
          speichern({
            ...state,
            verbrauch: istLetzte && neuerVerbrauch != null ? neuerVerbrauch : state.verbrauch,
            aktuellerPreis: istLetzte ? preis : state.aktuellerPreis,
            tankungen: state.tankungen.map((t) =>
              t.id === bearbeiteTankungId ? { ...t, ...eintrag } : t
            ),
          });
          setBearbeiteTankungId(null);
        } else {
          speichern({
            ...state,
            verbrauch: neuerVerbrauch != null ? neuerVerbrauch : state.verbrauch,
            aktuellerPreis: preis,
            tankungen: [...state.tankungen, { id: uid(), ...eintrag }],
          });
        }
        setTForm({ datum: today(), gesamt: "", liter: "20", gesamtbetrag: "", km: "" });
      };

      const tankungBearbeiten = (t) => {
        setBearbeiteTankungId(t.id);
        setTForm({
          datum: t.datum,
          gesamt: t.gesamt != null ? String(t.gesamt).replace(".", ",") : "",
          liter: String(t.liter),
          gesamtbetrag: t.gesamtbetrag != null ? String(t.gesamtbetrag).replace(".", ",") : "",
          km: t.km != null ? String(t.km) : "",
        });
      };

      const tankungBearbeitenAbbrechen = () => {
        setBearbeiteTankungId(null);
        setTForm({ datum: today(), gesamt: "", liter: "20", gesamtbetrag: "", km: "" });
      };

      const fahrtHinzufuegen = () => {
        const startKm = parseDE(fForm.startKm);
        if (!isFinite(startKm) || startKm < 0) {
          setFehler("Bitte gültige Anfangs-km eingeben."); return;
        }
        const endKmRoh = fForm.endKm.trim();
        let endKm = null;
        if (endKmRoh !== "") {
          endKm = parseDE(endKmRoh);
          if (!isFinite(endKm) || endKm <= startKm) {
            setFehler("End-km muss größer als Anfangs-km sein."); return;
          }
        }
        if (bearbeiteFahrtId) {
          setFehler("");
          speichern({
            ...state,
            fahrten: state.fahrten.map((f) =>
              f.id === bearbeiteFahrtId ? { ...f, datum: fForm.datum, startKm, endKm } : f
            ),
          });
          setBearbeiteFahrtId(null);
          setFForm({ datum: today(), startKm: endKm != null ? String(endKm) : fForm.startKm, endKm: "" });
          return;
        }
        if (!isFinite(letzterPreis) || letzterPreis === null || letzterPreis <= 0) {
          setFehler("Kein Literpreis vorhanden – bitte zuerst eine Tankung erfassen."); return;
        }
        setFehler("");
        speichern({ ...state, fahrten: [...state.fahrten, { id: uid(), datum: fForm.datum, startKm, endKm, preis: letzterPreis }] });
        setFForm({ datum: today(), startKm: endKm != null ? String(endKm) : "", endKm: "" });
      };

      const fahrtBearbeiten = (f) => {
        setBearbeiteFahrtId(f.id);
        setFForm({ datum: f.datum, startKm: String(f.startKm), endKm: f.endKm != null ? String(f.endKm) : "" });
      };

      const fahrtBearbeitenAbbrechen = () => {
        setBearbeiteFahrtId(null);
        const letzte = state.fahrten.length ? state.fahrten[state.fahrten.length - 1] : null;
        setFForm({ datum: today(), startKm: letzte && letzte.endKm != null ? String(letzte.endKm) : "", endKm: "" });
      };

      const eintragLoeschen = (art, id) => {
        if (art === "tankungen" && bearbeiteTankungId === id) tankungBearbeitenAbbrechen();
        if (art === "fahrten" && bearbeiteFahrtId === id) fahrtBearbeitenAbbrechen();
        speichern({ ...state, [art]: state[art].filter((e) => e.id !== id) });
      };

      const verbrauchSpeichern = () => {
        const v = parseDE(verbrauchInput);
        if (!isFinite(v) || v <= 0) { setFehler("Bitte gültigen Verbrauch eingeben."); return; }
        setFehler("");
        speichern({ ...state, verbrauch: v });
      };

      const alsBezahltMarkieren = () => {
        if (calc.gesamt <= 0) return;
        if (!window.confirm(`Gesamtbetrag ${fmtEUR(calc.gesamt)} als bezahlt markieren und neue Abrechnung starten?`)) return;
        const offeneFahrten = state.fahrten.filter((f) => f.endKm == null);
        const abgeschlosseneFahrten = state.fahrten.filter((f) => f.endKm != null);
        speichern({
          ...state,
          tankungen: [],
          fahrten: offeneFahrten,
          history: [{
            id: uid(), bezahltAm: today(), gesamt: calc.gesamt,
            kanisterKosten: calc.kanisterKosten, fahrtKosten: calc.fahrtKosten,
            kmGesamt: calc.kmGesamt, verbrauch: state.verbrauch,
            tankungen: state.tankungen, fahrten: abgeschlosseneFahrten,
          }, ...state.history],
        });
        setTab("verlauf");
      };

      return (
        <div className="min-h-screen text-slate-900 pb-10">
          <header className="bg-teal-900 text-white px-4 pt-5 pb-14">
            <div className="max-w-md mx-auto flex items-start justify-between">
              <div>
                <p className="text-[11px] font-semibold uppercase tracking-[0.2em] text-teal-300">Familien-Tankkasse</p>
                <h1 className="archivo text-2xl font-extrabold">Tankabrechnung</h1>
              </div>
              <div className="flex gap-2">
                <button onClick={laden} title="Neu laden"
                  className="rounded-lg bg-teal-800 hover:bg-teal-700 px-3 py-1.5 text-[13px] font-semibold">↻</button>
                <button onClick={() => sb.auth.signOut()}
                  className="rounded-lg bg-teal-800 hover:bg-teal-700 px-3 py-1.5 text-[13px] font-semibold">Abmelden</button>
              </div>
            </div>
          </header>

          <main className="max-w-md mx-auto px-4 -mt-10 space-y-4">
            <div className="drop-shadow-md">
              <div className="bg-white rounded-t-2xl px-5 pt-5 pb-3">
                <div className="flex items-baseline justify-between">
                  <p className="text-[11px] font-semibold uppercase tracking-wider text-slate-500">Offener Betrag</p>
                  <p className="text-[11px] text-slate-400">{sync || (updatedAt && `Stand: ${fmtZeit(updatedAt)}`)}</p>
                </div>
                <p className="mono text-4xl font-bold text-teal-900 mt-1">{fmtEUR(calc.gesamt)}</p>
                <div className="mt-4 space-y-1.5 text-[14px] border-t border-dashed border-slate-300 pt-3">
                  <div className="flex justify-between">
                    <span className="text-slate-600">Kanister ({fmtNum(state.tankungen.reduce((s, t) => s + t.liter, 0), 0)} l gesamt)</span>
                    <span className="mono font-semibold">{fmtEUR(calc.kanisterKosten)}</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-slate-600">Fahrt mit Roomi ({fmtNum(calc.kmGesamt, 0)} km)</span>
                    <span className="mono font-semibold">{fmtEUR(calc.fahrtKosten)}</span>
                  </div>
                  <div className="flex justify-between text-[12px] text-slate-400">
                    <span>Verbrauch: {fmtNum(state.verbrauch)} l/100 km</span>
                    {letzterPreis && <span>zuletzt {fmtNum(letzterPreis, 3)} €/l</span>}
                  </div>
                </div>
                <button onClick={alsBezahltMarkieren} disabled={calc.gesamt <= 0}
                  className="archivo mt-4 w-full rounded-xl bg-amber-400 hover:bg-amber-300 disabled:bg-slate-200 disabled:text-slate-400 text-teal-950 font-bold py-3 text-[15px] transition-colors">
                  Als bezahlt markieren
                </button>
              </div>
              <div className="beleg-kante"></div>
            </div>

            {fehler && (
              <div className="rounded-xl bg-red-50 border border-red-200 text-red-700 text-[14px] px-4 py-3">{fehler}</div>
            )}

            <nav className="flex gap-1 bg-slate-200 rounded-xl p-1">
              {[["aktuell", "Erfassen"], ["verlauf", `Verlauf (${state.history.length})`], ["einstellungen", "Auto"]].map(([key, label]) => (
                <button key={key} onClick={() => setTab(key)}
                  className={"flex-1 rounded-lg py-2 text-[14px] font-semibold transition-colors " +
                    (tab === key ? "bg-white text-teal-900 shadow-sm" : "text-slate-600")}>
                  {label}
                </button>
              ))}
            </nav>

            {tab === "aktuell" && (
              <React.Fragment>
                <Abschnitt titel="Tankung erfassen" hinweis="Gesamtmenge, Kanister-Anteil und Gesamtbetrag eingeben – Literpreis und Roomis Verbrauch werden automatisch berechnet.">
                  <div className="grid grid-cols-2 gap-2">
                    <div className="col-span-2 min-w-0">
                      <Feld label="Datum">
                        <input type="date" className={dateInputCls} value={tForm.datum} onChange={(e) => setTForm({ ...tForm, datum: e.target.value })} />
                      </Feld>
                    </div>
                    <Feld label="Gesamt Betankung l">
                      <input inputMode="decimal" placeholder="z. B. 68,3" className={inputCls} value={tForm.gesamt} onChange={(e) => setTForm({ ...tForm, gesamt: e.target.value })} />
                    </Feld>
                    <Feld label="davon Kanister l">
                      <input inputMode="decimal" className={inputCls} value={tForm.liter} onChange={(e) => setTForm({ ...tForm, liter: e.target.value })} />
                    </Feld>
                    <Feld label="Gesamtbetrag bezahlt €">
                      <input inputMode="decimal" placeholder="z. B. 108,50" className={inputCls} value={tForm.gesamtbetrag} onChange={(e) => setTForm({ ...tForm, gesamtbetrag: e.target.value })} />
                    </Feld>
                    <Feld label="Gefahrene km seit letzter Tankung">
                      <input inputMode="numeric" placeholder="z. B. 620" className={inputCls} value={tForm.km} onChange={(e) => setTForm({ ...tForm, km: e.target.value })} />
                    </Feld>
                  </div>
                  <p className="mt-2 text-[12px] text-slate-500">
                    {tVorschau
                      ? [
                          tVorschau.literpreis ? `Literpreis: ${fmtNum(tVorschau.literpreis, 3)} €/l` : null,
                          tVorschau.roomiListe != null ? `Roomi: ${fmtNum(tVorschau.roomiListe)} l` : null,
                          tVorschau.verbrauch ? `Verbrauch: ${fmtNum(tVorschau.verbrauch)} l/100 km` : null,
                        ].filter(Boolean).join(" · ") || "Gesamtmenge eingeben, um Literpreis zu berechnen."
                      : "Gesamtmenge eingeben, um Literpreis zu berechnen."}
                  </p>
                  <div className="mt-3 flex gap-2">
                    <button onClick={tankungHinzufuegen} className="flex-1 rounded-xl bg-teal-800 hover:bg-teal-700 text-white font-semibold py-2.5 text-[14px] transition-colors">
                      {bearbeiteTankungId ? "Tankung aktualisieren" : "Tankung hinzufügen"}
                    </button>
                    {bearbeiteTankungId && (
                      <button onClick={tankungBearbeitenAbbrechen} className="rounded-xl bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold px-4 text-[14px] transition-colors">
                        Abbrechen
                      </button>
                    )}
                  </div>
                  {state.tankungen.length > 0 && (
                    <ul className="mt-3 divide-y divide-slate-100">
                      {state.tankungen.slice().reverse().map((t) => (
                        <li key={t.id} className={"flex items-center justify-between py-2 text-[14px]" + (bearbeiteTankungId === t.id ? " bg-amber-50 -mx-4 px-4" : "")}>
                          <span className="text-slate-600">
                            {fmtDate(t.datum)} · {fmtNum(t.gesamt != null ? t.gesamt : t.liter)} l gesamt · {fmtNum(t.preis, 3)} €/l
                            {t.verbrauch != null && t.gesamt != null && (
                              <span className="block text-[12px] text-slate-400">Roomi {fmtNum(t.gesamt - t.liter)} l auf {fmtNum(t.km, 0)} km → {fmtNum(t.verbrauch)} l/100 km</span>
                            )}
                          </span>
                          <span className="flex items-center gap-3">
                            <span className="mono font-semibold">{fmtEUR(t.liter * t.preis)}</span>
                            <button onClick={() => tankungBearbeiten(t)} className="text-slate-400 hover:text-teal-700" aria-label="Tankung bearbeiten">✎</button>
                            <button onClick={() => eintragLoeschen("tankungen", t.id)} className="text-slate-400 hover:text-red-600" aria-label="Tankung löschen">✕</button>
                          </span>
                        </li>
                      ))}
                    </ul>
                  )}
                </Abschnitt>

                <Abschnitt titel="Fahrt mit Roomi" hinweis="Anfangs- und Endkilometerstand eintragen. Der Preis der letzten Tankung wird automatisch übernommen.">
                  <div className="grid grid-cols-2 gap-2">
                    <div className="col-span-2 min-w-0">
                      <Feld label="Datum">
                        <input type="date" className={dateInputCls} value={fForm.datum} onChange={(e) => setFForm({ ...fForm, datum: e.target.value })} />
                      </Feld>
                    </div>
                    <Feld label="Anfangs-km">
                      <input inputMode="numeric" placeholder="84250" className={inputCls} value={fForm.startKm} onChange={(e) => setFForm({ ...fForm, startKm: e.target.value })} />
                    </Feld>
                    <Feld label="End-km (optional, später ergänzbar)">
                      <input inputMode="numeric" placeholder="84410" className={inputCls} value={fForm.endKm} onChange={(e) => setFForm({ ...fForm, endKm: e.target.value })} />
                    </Feld>
                  </div>
                  <p className={"mt-2 text-[12px] " + (letzterPreis ? "text-slate-500" : "text-amber-600")}>
                    {letzterPreis
                      ? `Aktueller Preis: ${fmtNum(letzterPreis, 3)} €/l (aus letzter Tankung)`
                      : "Noch kein Preis hinterlegt – zuerst eine Tankung erfassen."}
                  </p>
                  <div className="mt-3 flex gap-2">
                    <button onClick={fahrtHinzufuegen} className="flex-1 rounded-xl bg-teal-800 hover:bg-teal-700 text-white font-semibold py-2.5 text-[14px] transition-colors">
                      {bearbeiteFahrtId ? "Fahrt aktualisieren" : "Fahrt hinzufügen"}
                    </button>
                    {bearbeiteFahrtId && (
                      <button onClick={fahrtBearbeitenAbbrechen} className="rounded-xl bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold px-4 text-[14px] transition-colors">
                        Abbrechen
                      </button>
                    )}
                  </div>
                  {calc.fahrtDetails.length > 0 && (
                    <ul className="mt-3 divide-y divide-slate-100">
                      {calc.fahrtDetails.slice().reverse().map((f) => (
                        <li key={f.id} className={"flex items-center justify-between py-2 text-[14px]" + (bearbeiteFahrtId === f.id ? " bg-amber-50 -mx-4 px-4" : "")}>
                          <span className="text-slate-600">
                            {f.offen
                              ? `${fmtDate(f.datum)} · unterwegs seit ${fmtNum(f.startKm, 0)} km`
                              : `${fmtDate(f.datum)} · ${fmtNum(f.km, 0)} km · ${fmtNum(f.liter, 1)} l`}
                          </span>
                          <span className="flex items-center gap-3">
                            {f.offen
                              ? <span className="text-[12px] font-semibold text-amber-600">offen</span>
                              : <span className="mono font-semibold">{fmtEUR(f.kosten)}</span>}
                            <button onClick={() => fahrtBearbeiten(f)} className="text-slate-400 hover:text-teal-700" aria-label="Fahrt bearbeiten">✎</button>
                            <button onClick={() => eintragLoeschen("fahrten", f.id)} className="text-slate-400 hover:text-red-600" aria-label="Fahrt löschen">✕</button>
                          </span>
                        </li>
                      ))}
                    </ul>
                  )}
                </Abschnitt>
              </React.Fragment>
            )}

            {tab === "einstellungen" && (
              <Abschnitt titel="Großes Auto" hinweis="Der Verbrauch wird normalerweise automatisch bei jeder Tankung berechnet (Tankinhalt ÷ km × 100).">
                <Feld label="Verbrauch l/100 km (manuelle Korrektur)">
                  <div className="flex gap-2">
                    <input inputMode="decimal" className={inputCls} value={verbrauchInput} onChange={(e) => setVerbrauchInput(e.target.value)} />
                    <button onClick={verbrauchSpeichern} className="rounded-xl bg-teal-800 hover:bg-teal-700 text-white font-semibold px-5 text-[14px] transition-colors">
                      Speichern
                    </button>
                  </div>
                </Feld>
                <p className="text-[13px] text-slate-500 mt-3">
                  Formel: km × Verbrauch ÷ 100 × Literpreis. Der Kanister wird 1:1 zum Tankpreis berechnet.
                </p>
              </Abschnitt>
            )}

            {tab === "verlauf" && (
              <Abschnitt titel="Bezahlte Abrechnungen"
                hinweis={state.history.length === 0 ? "Noch keine abgeschlossene Abrechnung." : undefined}>
                {state.history.length > 0 && (
                  <ul className="divide-y divide-slate-100">
                    {state.history.map((h) => (
                      <li key={h.id} className="py-3">
                        <div className="flex items-center justify-between">
                          <span className="font-semibold text-[15px]">Bezahlt am {fmtDate(h.bezahltAm)}</span>
                          <span className="mono font-bold text-teal-900 text-[16px]">{fmtEUR(h.gesamt)}</span>
                        </div>
                        <p className="text-[13px] text-slate-500 mt-0.5">
                          Kanister {fmtEUR(h.kanisterKosten)} · Fahrten {fmtEUR(h.fahrtKosten)} ({fmtNum(h.kmGesamt, 0)} km) · {fmtNum(h.verbrauch)} l/100 km
                        </p>
                      </li>
                    ))}
                  </ul>
                )}
              </Abschnitt>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
